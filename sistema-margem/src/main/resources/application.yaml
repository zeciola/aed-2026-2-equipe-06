sistema-margem:
  topico:
    emprestimo-solicitado: emprestimo.solicitado.v1
    margem-recusada: margem.recusada.v1
    margem-reservada: margem.reservada.v1
    analise-reprovada: analise.reprovada.v1
    margem-liberada: margem.liberada.v1
  simulacao:
    # CPF que sempre falha no MargemListener com erro transitorio de banco, para
    # demonstrar retry + DLQ (request/cpf_banco_indisponivel.json). Vazio desliga.
    cpf-banco-indisponivel: "55555555555"

spring:
  application:
    name: sistema-margem
  main:
    web-application-type: none

  kafka:
    bootstrap-servers: localhost:19093

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all                       # nao considera gravado ate as replicas confirmarem
      properties:
        enable.idempotence: true      # evita duplicata gerada pelo retry do PRODUTOR
        # Nao envia o nome da classe Java no cabecalho. Se enviasse, estaria
        # empurrando um detalhe INTERNO deste servico para dentro do contrato —
        # e o consumidor, que tem a classe dele, nao saberia o que fazer com isso.
        spring.json.add.type.headers: false

    consumer:
      group-id: sistema-margem
      auto-offset-reset: earliest
      enable-auto-commit: false       # quem confirma o offset e o nosso codigo
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Captura falha de desserializacao e entrega ao error handler (vai para a DLQ)
      # em vez de travar a particao repetindo o mesmo registro para sempre.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Ignora qualquer cabecalho de tipo que venha do produtor: a classe a
        # usar e a NOSSA, nao a dele. E o que permite que os dois servicos
        # tenham classes diferentes para o mesmo evento.
        spring.json.use.type.headers: false
        spring.json.value.default.type: br.com.puc.aed.sistemamargem.domain.EmprestimoSolicitadoEvent
        spring.json.trusted.packages: br.com.puc.aed.sistemamargem.domain
        metadata.max.age.ms: 5000

    listener:
      ack-mode: manual_immediate      # o ack e explicito, depois do commit

  datasource:
    url: jdbc:postgresql://localhost:15430/aed
    password: postgres
    username: postgres
    hikari:
      connection-timeout: 5000        # falha rapido quando o banco cai; o retry do Kafka espera o banco voltar

  sql:
    init:
      mode: always

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE